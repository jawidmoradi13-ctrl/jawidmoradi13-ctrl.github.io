<!DOCTYPE html>
<html lang='de'>
<head>
<meta charset='utf-8'>
<title>Mini Battle Royale</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:#0f172a;font-family:Segoe UI,Roboto,Arial}
#c{display:block}
#ui{position:fixed;inset:0;pointer-events:none;color:#e2e8f0;text-align:center}
#hud{display:none;gap:12px;position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(10,14,20,.8);border:1px solid #334155;padding:6px 14px;border-radius:6px;font-weight:600}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(rgba(15,23,42,.2),rgba(15,23,42,.9));gap:10px}
#overlay h1{font-size:48px;color:#f59e0b;letter-spacing:6px}
#overlay button{pointer-events:auto;background:#f59e0b;color:#1e293b;border:none;padding:10px 24px;font-weight:800;letter-spacing:2px;border-radius:4px;cursor:pointer}
#feed{position:absolute;top:70px;right:16px;display:flex;flex-direction:column;gap:6px;text-align:right;font-size:13px}
#info{position:absolute;bottom:16px;left:16px;display:flex;flex-direction:column;gap:6px;background:rgba(10,14,20,.7);border:1px solid #334155;padding:10px 12px;border-radius:6px;font-size:12px;text-align:left}
</style>
</head>
<body>
<canvas id='c'></canvas>
<div id='ui'>
  <div id='hud'><span id='pl'></span><span id='zo'></span><span id='ki'></span></div>
  <div id='feed'></div>
  <div id='info'><span>WASD · Maus · LMB · R · Shift · E</span><span id='hp'></span><span id='wp'></span></div>
  <div id='overlay'>
    <h1>MINI BR</h1>
    <p>30 Bots · Zone schrumpft · Nur einer überlebt</p>
    <button id='go'>SPIELEN</button>
  </div>
</div>
<script>
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let W,H;function rs(){W=innerWidth;H=innerHeight;cvs.width=W;cvs.height=H}
addEventListener('resize',rs);rs();
const WW=2400,WH=2400;
const rnd=(a,b)=>a+Math.random()*(b-a),d=(a,b,c,e)=>Math.hypot(a-c,b-e);
const wp={f:{n:'Faust',d:9,r:320,rt:380,mg:9999,sp:.05,a:false,p:1,rl:0,c:'#cbd5e0'},p:{n:'Pistole',d:15,r:420,rt:340,mg:12,sp:.05,a:false,p:1,rl:900,c:'#93c5fd'},smg:{n:'SMG',d:11,r:360,rt:80,mg:30,sp:.14,a:true,p:1,rl:1200,c:'#86efac'},rif:{n:'Gewehr',d:24,r:640,rt:110,mg:28,sp:.08,a:true,p:1,rl:1500,c:'#fde68a'},sh:{n:'Schrot',d:10,r:240,rt:700,mg:6,sp:.22,a:false,p:6,rl:1600,c:'#fb923c'},sn:{n:'Scharfschütze',d:70,r:1100,rt:1100,mg:5,sp:.01,a:false,p:1,rl:2000,c:'#d8b4fe'},m:{h:70}}
let obs=[],lt=[],ps=[],bl=[],pa=[],fd=[];let z={x:WW/2,y:WH/2,r:900,tr:900,n:12000,ph:1};let cam={x:0,y:0},run=false,go=false;
let k={},m={x:0,y:0,d:false};
function mw(){obs=[];lt=[];for(let i=0;i<90;i++){let w=rnd(60,200),h=rnd(60,200),x=rnd(120,WW-120-w),y=rnd(120,WH-120-h);obs.push({x,y,w,h});if(Math.random()<.6)lt.push({x:x+w/2,y:y+h/2,t:'g',g:['p','smg','rif','sh','sn'][(Math.random()*5)|0]})}for(let i=0;i<140;i++)obs.push({x:rnd(30,WW-30),y:rnd(30,WH-30),w:rnd(24,44),h:rnd(24,44),tr:true});for(let i=0;i<60;i++)lt.push({x:rnd(60,WW-60),y:rnd(60,WH-60),t:'m'})}
function mp(bot){return{x:rnd(200,WW-200),y:rnd(200,WH-200),r:14,hp:100,mhp:100,a:0,wn:'f',w:wp.f,am:9999,re:0,ls:0,dead:false,bot,name:bot?'BOT'+((Math.random()*900)|0):'DU',ang:0,hu:null,wan:0}}
function hr(px,py,r,o){let cx=Math.max(o.x,Math.min(px,o.x+o.w)),cy=Math.max(o.y,Math.min(py,o.y+o.h));return Math.hypot(px-cx,py-cy)<r}
function mv(p,dx,dy){let nx=p.x+dx,ny=p.y+dy,ok=1;for(let o of obs)if(hr(nx,p.y,p.r,o)){ok=0;break}if(ok)p.x=Math.max(p.r,Math.min(WW-p.r,nx));ok=1;for(let o of obs)if(hr(p.x,ny,p.r,o)){ok=0;break}if(ok)p.y=Math.max(p.r,Math.min(WH-p.r,ny))}
function los(ax,ay,bx,by){let D=d(ax,ay,bx,by),s=20;for(let i=0;i<D;i+=s){let x=ax+(bx-ax)*i/D,y=ay+(by-ay)*i/D;for(let o of obs)if(x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h)return false}return true}
function sh(p,now){let w=p.w;if(now-p.ls<w.rt)return;if(p.am<=0){rl(p,now);return}p.ls=now;if(w.mg<900)p.am--;for(let i=0;i<w.p;i++){let a=p.ang+rnd(-w.sp,w.sp);bl.push({x:p.x+Math.cos(a)*16,y:p.y+Math.sin(a)*16,vx:Math.cos(a)*1300,vy:Math.sin(a)*1300,li:w.r/1300,dm:w.d,ow:p})}for(let i=0;i<3;i++)pa.push({x:p.x+Math.cos(p.ang)*18,y:p.y+Math.sin(p.ang)*18,vx:Math.cos(p.ang)*rnd(40,120)+rnd(-30,30),vy:Math.sin(p.ang)*rnd(40,120)+rnd(-30,30),li:.16,c:'#fbbf24',r:2})}
function rl(p,now){let w=p.w;if(w.mg>=900||p.re<=0||p.am>=w.mg)return;if(p.rlu&&now<p.rlu)return;p.rlu=now+w.rl;setTimeout(()=>{if(p.dead)return;let n=w.mg-p.am,t=Math.min(n,p.re);p.am+=t;p.re-=t;p.rlu=0},w.rl)}
function dm(v,amt,by,now){if(v.dead)return;if(v.a>0){let ab=Math.min(v.a,amt*.5);v.a-=ab;amt-=ab}v.hp-=amt;for(let i=0;i<4;i++)pa.push({x:v.x,y:v.y,vx:rnd(-70,70),vy:rnd(-70,70),li:.25,c:'#f87171',r:2});if(v.hp<=0){v.dead=true;v.hp=0;if(by)by.kills++;fd.unshift({t:4,txt:(by?by.name:'Zone')+' tötete '+v.name});lt.push({x:v.x,y:v.y,t:'g',g:v.wn});lt.push({x:v.x+12,y:v.y,t:'m'});check(now)}}
function check(now){let a=ps.filter(p=>!p.dead);if(a.length===1&&!a[0].bot)end(true);if(a.length===0)end(false)}
function end(win){if(go)return;go=true;run=false;document.getElementById('overlay').style.display='flex';document.getElementById('overlay').children[0].textContent=win?'GEWONNEN':'AUSGESCHALTET';document.getElementById('overlay').children[0].style.color=win?'#22c55e':'#f87171';document.getElementById('overlay').children[1].textContent='Aktualisiere Seite für Neustart'}
function up(dt,now){const me=ps[0];z.r+=(z.tr-z.r)*.3*dt;if(now>z.n&&z.tr>140){z.n=now+11000;z.tr*=.6;z.ph++;fd.unshift({t:4,txt:'ZONE '+z.ph+' schrumpft'})}
for(let p of ps){if(p.dead)continue;if(d(p.x,p.y,z.x,z.y)>z.r)p.hp-=10*dt;if(p.hp<=0)dm(p,1,null,now);if(p.bot)bt(p,dt,now);else hc(p,dt,now);
for(let i=lt.length-1;i>=0;i--){let l=lt[i];if(d(p.x,p.y,l.x,l.y)<24){if(l.t==='g'){let w=wp[l.g];if(p.w===wp.f||w.d>p.w.d){p.w=w;p.wn=l.g;p.am=w.mg;p.re=w.mg*2;lt.splice(i,1)}}else if(p.hp<p.mhp){p.hp=Math.min(p.mhp,p.hp+70);lt.splice(i,1)}}}}
for(let i=bl.length-1;i>=0;i--){let b=bl[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.li-=dt;let hit=false;for(let o of obs){if(b.x>o.x&&b.x<o.x+o.w&&b.y>o.y&&b.y<o.y+o.h){hit=true;break}}if(!hit){for(let p of ps){if(p.dead||p===b.ow)continue;if(d(b.x,b.y,p.x,p.y)<p.r){dm(p,b.dm,b.ow,now);hit=true;break}}}if(hit||b.li<=0)bl.splice(i,1)}
for(let i=pa.length-1;i>=0;i--){let pt=pa[i];pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.li-=dt;if(pt.li<=0)pa.splice(i,1)}
for(let i=fd.length-1;i>=0;i--){fd[i].t-=dt;if(fd[i].t<=0)fd.splice(i,1)}
cam.x=me.x-W/2;cam.y=me.y-H/2}
function hc(p,dt,now){let dx=(k['a']?-1:0)+(k['d']?1:0),dy=(k['w']?-1:0)+(k['s']?1:0);let l=Math.hypot(dx,dy)||1,sp=150*(k['shift']?1.5:1);mv(p,dx/l*sp*dt,dy/l*sp*dt);p.ang=Math.atan2(m.y-H/2,m.x-W/2);if(m.d&&(p.w.a||now-p.ls>p.w.rt))sh(p,now);if(k['r']){rl(p,now);k['r']=false}}}
function bt(p,dt,now){if(!p.hu||p.hu.dead||d(p.x,p.y,p.hu.x,p.hu.y)>560){let b=null,bd=460;for(let o of ps){if(o.dead||o===p)continue;let dd=d(p.x,p.y,o.x,o.y);if(dd<bd){bd=dd;b=o}}p.hu=b}let tx,ty;const out=d(p.x,p.y,z.x,z.y)>z.r-40;if(out){tx=z.x;ty=z.y}else if(p.hu){let dd=d(p.x,p.y,p.hu.x,p.hu.y);p.ang=Math.atan2(p.hu.y-p.y,p.hu.x-p.x);if(dd>170){tx=p.hu.x;ty=p.hu.y}else if(dd<90){tx=p.x-(p.hu.x-p.x);ty=p.y-(p.hu.y-p.y)}else{tx=p.x;ty=p.y}if(dd<p.w.r&&los(p.x,p.y,p.hu.x,p.hu.y))sh(p,now)}else{p.wan+=rnd(-.5,.5)*dt*2;tx=p.x+Math.cos(p.wan)*200;ty=p.y+Math.sin(p.wan)*200}let a=Math.atan2(ty-p.y,tx-p.x);mv(p,Math.cos(a)*130*dt,Math.sin(a)*130*dt);if(p.am<=0)rl(p,now)}
function dr(){ctx.fillStyle='#1e293b';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-cam.x,-cam.y);ctx.strokeStyle='rgba(255,255,255,.03)';for(let x=0;x<WW;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,WH);ctx.stroke()}for(let y=0;y<WH;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(WW,y);ctx.stroke()}ctx.save();ctx.beginPath();ctx.rect(cam.x,cam.y,W,H);ctx.arc(z.x,z.y,z.r,0,6.28,true);ctx.fillStyle='rgba(248,113,113,.12)';ctx.fill();ctx.restore();ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,6.28);ctx.strokeStyle='#ef4444';ctx.lineWidth=3;ctx.stroke();for(let l of lt){ctx.save();ctx.translate(l.x,l.y);if(l.t==='m'){ctx.fillStyle='#22c55e';ctx.fillRect(-6,-6,12,12)}else{ctx.fillStyle=wp[l.g].c;ctx.fillRect(-8,-4,16,8)}ctx.restore()}ctx.lineWidth=2;for(let b of bl){ctx.strokeStyle='#fef08a';ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.012,b.y-b.vy*.012);ctx.stroke()}for(let p of ps){if(p.dead)continue;ctx.save();ctx.translate(p.x,p.y);ctx.beginPath();ctx.arc(0,0,p.r+2,0,6.28);ctx.fillStyle=p.bot?'rgba(0,0,0,.3)':'rgba(245,158,11,.25)';ctx.fill();ctx.beginPath();ctx.arc(0,0,p.r,0,6.28);ctx.fillStyle=p.bot?'#475569':'#f59e0b';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.rotate(p.ang);ctx.fillStyle=p.w.c;ctx.fillRect(6,-3,14,6);ctx.restore();if(p.a>0){ctx.beginPath();ctx.arc(p.x,p.y,p.r+3,0,6.28);ctx.strokeStyle='rgba(59,130,246,.8)';ctx.lineWidth=2;ctx.stroke()}}for(let pt of pa){ctx.globalAlpha=Math.max(0,pt.li*4);ctx.fillStyle=pt.c;ctx.beginPath();ctx.arc(pt.x,pt.y,pt.r,0,6.28);ctx.fill();ctx.globalAlpha=1}ctx.restore();hud()}
function hud(){const me=ps[0],a=ps.filter(p=>!p.dead).length;document.getElementById('pl').textContent=a+' übrig';document.getElementById('zo').textContent='ZONE '+z.ph;document.getElementById('ki').textContent='Kills '+me.kills;document.getElementById('hp').textContent='HP '+Math.ceil(me.hp)+'  R '+Math.ceil(me.a);document.getElementById('wp').textContent=me.w.n+'  '+me.am+(me.w.mg<900?'/'+me.re:'');let f='';for(let i=0;i<Math.min(5,fd.length);i++)f+=fd[i].txt+'<br>';document.getElementById('feed').innerHTML=f}
let lst=0;function lp(t){let dt=Math.min(.05,(t-lst)/1000);lst=t;if(run)up(dt,t);dr();requestAnimationFrame(lp)}
addEventListener('keydown',e=>{k[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{k[e.key.toLowerCase()]=false});addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY});addEventListener('mousedown',e=>{if(e.button===0)m.d=true});addEventListener('mouseup',e=>{if(e.button===0)m.d=false});addEventListener('contextmenu',e=>e.preventDefault());
document.getElementById('go').onclick=()=>{document.getElementById('overlay').style.display='none';document.getElementById('hud').style.display='flex';mw();ps=[];ps.push(mp(false));for(let i=1;i<30;i++)ps.push(mp(true));run=true};
lp(performance.now());
</script>
</body>
</html>

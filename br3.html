<!DOCTYPE html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>PUBG Mini</title><style>html,body{margin:0;overflow:hidden;background:#0f1a12;font-family:Segoe UI,Roboto,Arial;color:#e2e8f0}#c{display:block}#ui{position:fixed;inset:0;pointer-events:none}#hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:none;gap:12px;background:rgba(10,14,20,.85);padding:6px 14px;border:1px solid #3b7a3f;border-radius:6px;font-weight:700}#over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(rgba(15,26,18,.2),rgba(15,26,18,.95))}#over h1{color:#f59e0b;font-size:52px;letter-spacing:8px;margin:0}#over p{opacity:.8;margin:8px 0 16px}#over button{pointer-events:auto;background:#f59e0b;border:none;padding:10px 22px;font-weight:800;border-radius:4px;cursor:pointer}#kill{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);font-size:22px;color:#fca5a5;opacity:0;transition:opacity .2s}#kill.show{opacity:1}</style></head><body><canvas id='c'></canvas><div id='ui'><div id='hud'><span id='left'></span><span id='zone'></span><span id='kills'></span></div><div id='kill'>ELIMINIERT</div><div id='over'><h1>PUBG MINI</h1><p>WASD · Maus · Linksklick · R · Shift</p><button id='go'>START</button></div></div><script>
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let W,H;function rs(){W=innerWidth;H=innerHeight;cvs.width=W;cvs.height=H;}addEventListener('resize',rs);rs();
const WW=2600,WH=2600,rnd=(a,b)=>a+Math.random()*(b-a),dst=(a,b,c,d)=>Math.hypot(a-c,b-d);
const Wp={f:{n:'Faust',d:8,r:70,rt:300,mg:9999,sp:.04,a:false,p:1,rl:0,c:'#cbd5e0'},p:{n:'Pistole',d:16,r:460,rt:320,mg:14,sp:.05,a:false,p:1,rl:1000,c:'#93c5fd'},sm:{n:'SMG',d:11,r:380,rt:90,mg:32,sp:.12,a:true,p:1,rl:1400,c:'#86efac'},rif:{n:'Sturmgewehr',d:26,r:660,rt:110,mg:30,sp:.07,a:true,p:1,rl:1800,c:'#fde68a'},sh:{n:'Schrotflinte',d:12,r:260,rt:800,mg:6,sp:.19,a:false,p:7,rl:2200,c:'#fb923c'},sn:{n:'Scharfschütze',d:78,r:1180,rt:1200,mg:5,sp:.012,a:false,p:1,rl:2500,c:'#d8b4fe'}}
let obs=[],bul=[],par=[],feed=[];let pl={x:1300,y:1300,r:14,hp:100,mhp:100,ang:0,am:9999,re:0,ls:0,wn:'f',w:Wp.f,k:0,dead:false,rld:0};let en=[];let z={x:1300,y:1300,r:1000,tr:1000,n:Date.now()+13000,ph:1};let k={},m={x:0,y:0,d:false},run=false,over=false;
function world(){obs=[];for(let i=0;i<110;i++){let w=rnd(60,220),h=rnd(60,220),x=rnd(140,WW-140-w),y=rnd(140,WH-140-h);obs.push({x,y,w,h});}for(let i=0;i<40;i++)obs.push({x:rnd(40,WW-40),y:rnd(40,WH-40),w:rnd(26,48),h:rnd(26,48),t:true});for(let i=0;i<28;i++)en.push({x:rnd(300,2300),y:rnd(300,2300),r:14,hp:100,ang:0,am:20,re:60,ls:0,wn:'p',w:Wp.p,dead:false,tar:null});}
function hr(px,py,r,o){let cx=Math.max(o.x,Math.min(px,o.x+o.w)),cy=Math.max(o.y,Math.min(py,o.y+o.h));return dst(px,py,cx,cy)<r}
function mv(e,dx,dy){let nx=e.x+dx,ny=e.y+dy,ok=1;for(let o of obs){if(nx>o.x&&nx<o.x+o.w&&ny>o.y&&ny<o.y+o.h){ok=0;break}}if(ok&&nx>e.r&&nx<WW-e.r)e.x=nx;ok=1;for(let o of obs){if(e.x>o.x&&e.x<o.x+o.w&&ny>o.y&&ny<o.y+o.h){ok=0;break}}if(ok&&ny>e.r&&ny<WH-e.r)e.y=ny}
function los(a,b,c,d){let D=dst(a,b,c,d),s=24;for(let i=0;i<D;i+=s){let x=a+(c-a)*i/D,y=b+(d-b)*i/D;for(let o of obs){if(x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h)return false}}return true}
function sh(e){let w=e.w,now=Date.now();if(now-e.ls<w.rt)return;if(e.am<=0)return;e.ls=now;if(w.mg<900)e.am--;for(let i=0;i<w.p;i++){let a=e.ang+rnd(-w.sp,w.sp);bul.push({x:e.x+Math.cos(a)*18,y:e.y+Math.sin(a)*18,vx:Math.cos(a)*1200,vy:Math.sin(a)*1200,li:w.r/1200,dm:w.d,ow:e})}}
function dm(v,amt,by){if(v.dead)return;v.hp-=amt;if(v.hp<=0){v.dead=true;if(by){by.k+=1;feed.push({t:3,txt:'Kill'});showKill()}}}
function showKill(){let k=document.getElementById('kill');k.classList.add('show');setTimeout(()=>k.classList.remove('show'),900)}
function up(dt,now){if(dst(pl.x,pl.y,z.x,z.y)>z.r){pl.hp-=10*dt;if(pl.hp<=0&&run){over=true;run=false;setTimeout(()=>{document.getElementById('over').children[0].textContent='AUSGESCHALTET';document.getElementById('over').children[1].textContent='Kills: '+pl.k;document.getElementById('over').style.display='flex';},400)}}if(now>z.n&&z.tr>150){z.n=now+11000;z.tr*=.62;z.ph++}z.r+=(z.tr-z.r)*.25*dt;let dx=(k['a']?-1:0)+(k['d']?1:0),dy=(k['w']?-1:0)+(k['s']?1:0);let L=Math.hypot(dx,dy)||1,sp=160*(k['shift']?1.5:1);mv(pl,dx/L*sp*dt,dy/L*sp*dt);pl.ang=Math.atan2(m.y-H/2,m.x-W/2);if(m.d)sh(pl);for(let e of en){if(e.dead)continue;if(!e.tar||e.tar.dead||dst(e.x,e.y,e.tar.x,e.tar.y)>520){let best=null,bd=480;for(let x of en){if(x.dead||x===e)continue;let dd=dst(e.x,e.y,x.x,x.y);if(dd<bd){bd=dd;best=x}}if(!best&&dst(e.x,e.y,pl.x,pl.y)<560)best=pl;e.tar=best}if(e.tar){let t=e.tar,a2=Math.atan2(t.y-e.y,t.x-e.x);e.ang=a2;if(dst(e.x,e.y,t.x,t.y)<e.w.r&&los(e.x,e.y,t.x,t.y))sh(e)}mv(e,Math.cos(e.ang)*110*dt,Math.sin(e.ang)*110*dt)}for(let i=bul.length-1;i>=0;i--){let b=bul[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.li-=dt;let h=false;for(let o of obs){if(b.x>o.x&&b.x<o.x+o.w&&b.y>o.y&&b.y<o.y+o.h){h=true;break}}if(!h){if(!pl.dead&&b.ow!==pl&&dst(b.x,b.y,pl.x,pl.y)<pl.r){dm(pl,b.dm,b.ow);h=true}for(let e of en){if(e.dead||b.ow===e)continue;if(dst(b.x,b.y,e.x,e.y)<e.r){dm(e,b.dm,b.ow);h=true;break}}}if(h||b.li<=0)bul.splice(i,1)}for(let i=feed.length-1;i>=0;i--){feed[i].t-=dt;if(feed[i].t<=0)feed.splice(i,1)}let alive=en.filter(e=>!e.dead).length+(!pl.dead?1:0);if(alive<=1&&!over){over=true;run=false;setTimeout(()=>{document.getElementById('over').children[0].textContent='GEWONNEN';document.getElementById('over').children[1].textContent='Kills: '+pl.k;document.getElementById('over').style.display='flex';},400)}}
function dr(){ctx.fillStyle='#1a2b1d';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-pl.x+W/2,-pl.y+H/2);ctx.strokeStyle='rgba(255,255,255,.03)';for(let i=0;i<WW;i+=70){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,WH);ctx.stroke()}for(let i=0;i<WH;i+=70){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(WW,i);ctx.stroke()}ctx.beginPath();ctx.rect(0,0,WW,WH);ctx.arc(z.x,z.y,z.r,0,7,true);ctx.fillStyle='rgba(239,68,68,.12)';ctx.fill();ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.strokeStyle='#ef4444';ctx.lineWidth=3;ctx.stroke();for(let o of obs){ctx.fillStyle=o.t?'#1f3323':'#274d32';ctx.fillRect(o.x,o.y,o.w,o.h)}for(let b of bul){ctx.strokeStyle='#fef08a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*.01,b.y-b.vy*.01);ctx.stroke()}for(let e of en){if(e.dead)continue;ctx.save();ctx.translate(e.x,e.y);ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.fillStyle='#a78bfa';ctx.fill();ctx.strokeStyle='#ddd6fe';ctx.lineWidth=1.5;ctx.stroke();ctx.rotate(e.ang);ctx.fillStyle='#c4b5fd';ctx.fillRect(10,-3,12,6);ctx.restore()}ctx.save();ctx.translate(pl.x,pl.y);ctx.rotate(pl.ang);ctx.fillStyle=pl.w.c;ctx.fillRect(12,-4,16,8);ctx.restore();ctx.beginPath();ctx.arc(pl.x,pl.y,14,0,7);ctx.fillStyle='#f59e0b';ctx.fill();ctx.strokeStyle='#fff7ed';ctx.lineWidth=2;ctx.stroke();ctx.restore();ctx.fillStyle='#e2e8f0';ctx.font='14px Segoe UI';ctx.fillText('Kills: '+pl.k+'  HP: '+Math.max(0,Math.floor(pl.hp))+'  '+pl.w.n,20,H-40);let f='';for(let i=0;i<Math.min(4,feed.length);i++)f+='[Kill]  ';ctx.fillText(f,20,30);document.getElementById('left').textContent=en.filter(e=>!e.dead).length+' Gegner übrig';document.getElementById('zone').textContent='Zone '+z.ph;document.getElementById('kills').textContent='Deine Kills '+pl.k;}
let lt=0;function loop(t){if(!run)return requestAnimationFrame(loop);let dt=Math.min(.05,(t-lt)/1000);lt=t;up(dt,Date.now());dr();requestAnimationFrame(loop)}
addEventListener('keydown',e=>k[e.key.toLowerCase()]=true);addEventListener('keyup',e=>k[e.key.toLowerCase()]=false);addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY});addEventListener('mousedown',e=>{if(e.button===0)m.d=true});addEventListener('mouseup',e=>{if(e.button===0)m.d=false});addEventListener('contextmenu',e=>e.preventDefault());document.getElementById('go').onclick=()=>{document.getElementById('over').style.display='none';document.getElementById('hud').style.display='flex';world();run=true;loop(performance.now());};loop(performance.now());
</script></body></html>

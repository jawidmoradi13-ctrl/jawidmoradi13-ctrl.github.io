<!DOCTYPE html><html lang='de'><head><meta charset='utf-8'><title>BR Fix</title><style>html,body{margin:0;overflow:hidden;background:#111;font-family:sans-serif}#c{display:block}#o{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;background:rgba(0,0,0,.6)}#o h1{color:#ff7b00;letter-spacing:4px}#o button{margin-top:10px;padding:10px 18px;background:#ff7b00;border:none;font-weight:800;cursor:pointer}</style></head><body><canvas id='c'></canvas><div id='o'><h1>BATTLE ROYALE</h1><p>WASD · Maus · LMB · R · SHIFT</p><button id='s'>START</button></div><script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H;addEventListener('resize',()=>{W=innerWidth;H=innerHeight;c.width=W;c.height=H});
const rnd=(a,b)=>a+Math.random()*(b-a),d=(a,b,cc,e)=>Math.hypot(a-cc,b-e);
let p={x:1200,y:1200,r:14,hp:100,a:0,ang:0,dead:false,am:30,re:90,ls:0,w:'g',k:0};
let bs=[],obs=[],en=[];let z={x:1200,y:1200,r:900,tr:900,t:0};
let k={},m={x:0,y:0,down:false};let run=false;
function init(){for(let i=0;i<60;i++)obs.push({x:rnd(100,2300),y:rnd(100,2300),w:rnd(40,160),h:rnd(40,160)});for(let i=0;i<29;i++)en.push({x:rnd(200,2200),y:rnd(200,2200),r:14,hp:100,ang:0,dead:false,am:15,re:60,ls:0});}
function mv(e,dx,dy){let nx=e.x+dx,ny=e.y+dy;let ok=1;for(let o of obs)if(nx>o.x&&nx<o.x+o.w&&ny>o.y&&ny<o.y+o.h){ok=0;break}if(ok&&nx>e.r&&nx<2400-e.r)e.x=nx;if(ok&&ny>e.r&&ny<2400-e.r)e.y=ny}
function lp(t){if(!run)return requestAnimationFrame(lp);let dt=Math.min(.033,(t-(lp.lt||t))/1000);lp.lt=t;
  let dx=(k.a?-1:0)+(k.d?1:0),dy=(k.w?-1:0)+(k.s?1:0);let L=Math.hypot(dx,dy)||1;mv(p,dx/L*140*dt,dy/L*140*dt);p.ang=Math.atan2(m.y-H/2,m.x-W/2);
  if(m.down&&t-p.ls>180){p.ls=t;bs.push({x:p.x+Math.cos(p.ang)*18,y:p.y+Math.sin(p.ang)*18,vx:Math.cos(p.ang)*900,vy:Math.sin(p.ang)*900,li:.6,ow:p});}
  for(let i=bs.length-1;i>=0;i--){let b=bs[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.li-=dt;let h=false;for(let o of obs)if(b.x>o.x&&b.x<o.x+o.w&&b.y>o.y&&b.y<o.y+o.h){h=true;break}if(!h)for(let e of en){if(e.dead)continue;if(d(b.x,b.y,e.x,e.y)<e.r){e.hp-=15;if(e.hp<=0){e.dead=true;p.k++}h=true;break}}if(h||b.li<=0)bs.splice(i,1)}
  x.fillStyle='#1b2a22';x.fillRect(0,0,W,H);x.save();x.translate(-p.x+W/2,-p.y+H/2);x.strokeStyle='rgba(255,255,255,.04)';for(let i=0;i<2400;i+=60){x.beginPath();x.moveTo(i,0);x.lineTo(i,2400);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(2400,i);x.stroke()}x.beginPath();x.arc(z.x,z.y,z.r,0,7);x.strokeStyle='#ff4444';x.stroke();for(let o of obs){x.fillStyle='#264a36';x.fillRect(o.x,o.y,o.w,o.h)}for(let e of en){if(e.dead)continue;x.save();x.translate(e.x,e.y);x.fillStyle='#8b5cf6';x.beginPath();x.arc(0,0,12,0,7);x.fill();x.restore()}for(let b of bs){x.fillStyle='#fff3b0';x.beginPath();x.arc(b.x,b.y,2,0,7);x.fill()}x.save();x.translate(p.x,p.y);x.rotate(p.ang);x.fillStyle='#fff';x.fillRect(8,-3,16,6);x.restore();x.beginPath();x.fillStyle='#f59e0b';x.arc(p.x,p.y,14,0,7);x.fill();x.restore();x.fillStyle='#fff';x.font='16px sans-serif';x.fillText('Kills '+p.k+' | HP '+Math.floor(p.hp),16,28);requestAnimationFrame(lp)}
addEventListener('keydown',e=>k[e.key.toLowerCase()]=true);addEventListener('keyup',e=>k[e.key.toLowerCase()]=false);addEventListener('mousemove',e=>{m.x=e.clientX;m.y=e.clientY});addEventListener('mousedown',e=>{if(e.button===0)m.down=true});addEventListener('mouseup',e=>{if(e.button===0)m.down=false});document.getElementById('s').onclick=()=>{document.getElementById('o').style.display='none';init();run=true;lp(performance.now())};addEventListener('resize');resize();lp(performance.now());
</script></body></html>
